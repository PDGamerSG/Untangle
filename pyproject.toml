[project]
name = "untangle"
version = "0.1.0"
description = "Untangle: answers 'why is the code like this?' from a Neo4j graph of commits, PRs, issues, ADRs and Hinglish handover calls, with evidence on every answer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "neo4j>=5.28",
  "pydantic>=2.8",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "orjson>=3.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
embed = ["fastembed>=0.4"]
sarvam = ["sarvamai>=0.1.30"]
all = ["untangle[llm,embed,sarvam]"]

[project.scripts]
untangle = "untangle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/untangle"]

[tool.hatch.build.targets.wheel.force-include]
"cypher" = "untangle/graph/cypher"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["neo4j: needs a reachable Neo4j (skipped when NEO4J_URI does not answer)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "UP046", "UP047"]  # TypeVar generics read fine and match the adapters' style
