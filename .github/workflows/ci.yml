name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2025.09
        env:
          NEO4J_AUTH: neo4j/untangle-dev-password
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 40
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: untangle-dev-password
      LLM_BACKEND: fake
      EMBED_BACKEND: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras
      - run: uv build --wheel
      - name: Check wheel query loading outside the checkout
        run: |
          uv run python - <<'PY'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with tempfile.TemporaryDirectory() as target:
              with ZipFile(wheel) as archive:
                  archive.extractall(target)
              subprocess.run(
                  [sys.executable, "-I", "-c",
                   "import sys; sys.path.insert(0, sys.argv[1]); "
                   "from untangle.graph.queries import list_queries, load_cypher, schema_statements; "
                   "assert load_cypher('why_path'); "
                   "assert any('`vector.dimensions`: 384' in q for q in schema_statements(384)); "
                   "assert all(load_cypher(q) for q in list_queries())",
                   target],
                  cwd=target, check=True,
              )
          PY
      - run: uv run ruff check src tests
      - run: uv run untangle schema
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_UNTANGLE_SAMPLE: "1"

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
